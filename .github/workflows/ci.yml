name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: SwiftLint · Testes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o gitleaks varre o histórico inteiro

      - name: Ferramentas
        run: brew install swiftlint gitleaks

      - name: Gitleaks
        run: gitleaks git --redact --no-banner

      - name: SwiftLint
        run: swiftlint --strict

      - name: Testes
        run: swift test
